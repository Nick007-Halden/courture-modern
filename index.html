<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Couture Modern — Bespoke Fashion</title>
  <meta name="description" content="Couture Modern — where haute couture meets futuristic streetwear. Shop curated collections, view lookbooks, and book bespoke consultations." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent:#C69C6D; /* warm gold */
      --bg:#070707;
      --card:#0f0f0f;
      --muted:#bdbdbd;
      --glass: rgba(255,255,255,0.04);
      --radius:16px;
      --glass-strong: rgba(255,255,255,0.06);
      --accent-2: #8fd3ff;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;font-family:Inter,system-ui,Arial; background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden
    }

    /* NAV */
    header{position:fixed;left:0;right:0;top:0;z-index:100;backdrop-filter: blur(8px);background:linear-gradient(180deg, rgba(0,0,0,0.5), transparent);padding:14px 36px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{font-family: 'Playfair Display', serif;font-weight:700;font-size:20px;color:var(--accent);letter-spacing:1px}
    nav{display:flex;gap:18px;align-items:center}
    nav a{color:#ddd;text-decoration:none;font-size:15px;position:relative;padding:6px}
    nav a::after{content:'';height:2px;background:var(--accent);position:absolute;left:6px;right:6px;bottom:2px;transform:scaleX(0);transform-origin:left center;transition:transform .28s ease}
    nav a:hover::after{transform:scaleX(1)}
    .cta{background:var(--accent);color:#070707;padding:10px 14px;border-radius:12px;font-weight:600;text-decoration:none}
    .menu-toggle{display:none}

    /* HERO */
    .hero{min-height:92vh;padding-top:84px;display:grid;grid-template-columns:1fr 480px;gap:40px;align-items:center;padding:84px 6vw}
    .eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-size:12px}
    h1{font-family:'Playfair Display',serif;font-size:56px;margin:6px 0 12px;line-height:1.02}
    .sub{color:var(--muted);max-width:58ch;font-size:16px}
    .shop-btn{display:inline-block;margin-top:20px;padding:12px 18px;border-radius:12px;background:transparent;border:1px solid rgba(255,255,255,0.06);backdrop-filter: blur(4px)}

    .panel{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:22px;border-radius:18px;border:1px solid rgba(255,255,255,0.03)}
    .ph-item{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .ph-item img{width:72px;height:72px;object-fit:cover;border-radius:12px}

    /* Collections */
    section.products{padding:48px 6vw}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.03);transform:translateY(0);transition:transform .28s ease, box-shadow .28s ease}
    .card:hover{transform:translateY(-8px);box-shadow:0 30px 60px rgba(0,0,0,0.7)}
    .card img{width:100%;height:320px;object-fit:cover;border-radius:10px}
    .price{color:var(--accent);font-weight:700}

    /* Lookbook */
    .lookbook{padding:28px 6vw;display:grid;grid-template-columns:1fr 420px;gap:32px;align-items:center}
    .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .photos img{width:100%;height:160px;object-fit:cover;border-radius:10px}

    /* Couture drop */
    .drop{padding:64px 6vw;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));display:flex;gap:24px;align-items:center}
    .drop .left{flex:1}
    .drop .right{flex:1}
    .drop .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.03);font-size:13px;color:var(--muted)}
    .drop h2{font-family:'Playfair Display',serif;font-size:36px}

    /* About + Contact */
    .about-contact{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:36px 6vw}
    .glass{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:22px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
    form{display:flex;flex-direction:column;gap:12px}
    input,textarea{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:12px;border-radius:10px;color:#fff}
    button[type=submit]{background:var(--accent);border:none;padding:12px;border-radius:10px;font-weight:700}

    footer{padding:26px 6vw;border-top:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center}

    /* Animations */
    .fade-up{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease}
    .in-view{opacity:1;transform:none}

    /* Dark/Noir toggle */
    .theme-toggle{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px;border-radius:10px;color:var(--muted)}

    /* Responsive */
    @media (max-width:980px){
      .hero{grid-template-columns:1fr;padding:120px 6vw}
      .hero h1{font-size:40px}
      .lookbook{grid-template-columns:1fr}
      .about-contact{grid-template-columns:1fr}
      nav{display:none}
      .menu-toggle{display:block;color:#fff}
    }

    @media (max-width:520px){
      .card img{height:220px}
    }

    /* subtle parallax */
    .parallax{will-change:transform}

    /* accessibility focus states */
    a:focus, button:focus, input:focus{outline:3px solid rgba(198,156,109,0.12);outline-offset:2px}
  </style>
</head>
<body class="bg-white text-gray-900 tracking-tight antialiased">
  <header class="fixed top-0 left-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 transition-all duration-300">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="text-3xl font-['Playfair_Display'] font-light">Couture Modern</div>
      <ul class="space-x-8 hidden md:flex text-lg font-light">
        <li class="hover:opacity-60 transition cursor-pointer">Home</li>
        <li class="hover:opacity-60 transition cursor-pointer">Collections</li>
        <li class="hover:opacity-60 transition cursor-pointer">Lookbook</li>
        <li class="hover:opacity-60 transition cursor-pointer">Contact</li>
      </ul>
      <button id="mobileMenuBtn" class="md:hidden text-3xl">☰</button>
    </nav>
  </header>
  <section class="h-screen flex items-center justify-center bg-cover bg-center" style="background:url('https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=1400&q=80') no-repeat;">
    <div class="text-center px-6 animate-fadeIn opacity-0 translate-y-8">
      <h1 class="text-5xl md:text-7xl font-['Playfair_Display'] font-light mb-6">Modern Parisian Couture</h1>
      <p class="text-lg md:text-xl font-light max-w-2xl mx-auto opacity-80">Effortless minimalism crafted with poetic precision.</p>
    </div>
  </section>
  <section class="py-24 px-6 md:px-12 text-center animate-fadeIn opacity-0 translate-y-8">
    <h2 class="text-4xl md:text-5xl font-['Playfair_Display'] font-light mb-4">Featured Editorial</h2>
    <p class="text-lg md:text-xl font-light max-w-3xl mx-auto opacity-70">A curated capsule inspired by the quiet architecture of light and shadow.</p>
  </section>
  <script>
    document.addEventListener('scroll',()=>{
      document.querySelectorAll('.animate-fadeIn').forEach(el=>{
        if(el.getBoundingClientRect().top < window.innerHeight*0.85){el.style.opacity=1;el.style.transform='translateY(0)';el.style.transition='all 1s ease';}
      });
    });
  </script>
</body>
</html>
